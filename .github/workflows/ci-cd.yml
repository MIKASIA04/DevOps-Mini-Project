
name: CI-CD and Health Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t devops-health-check .

      - name: Run Docker container
        run: docker run -d -p 3000:3000 --name health-app devops-health-check

      - name: Verify Docker container health status
        run: |
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' health-app)
            echo "Container health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Docker health check passed"
              curl -fsS http://localhost:3000/health
              echo
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container is unhealthy"
              docker logs health-app
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for healthy container"
          docker inspect health-app
          docker logs health-app
          exit 1
