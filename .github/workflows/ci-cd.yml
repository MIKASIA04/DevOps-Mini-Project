
name: CI-CD and Health Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t devops-health-check .

      - name: Run Docker container
        run: docker run -d -p 3000:3000 --name health-app devops-health-check

      - name: Verify application health
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:3000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs health-app
          exit 1
